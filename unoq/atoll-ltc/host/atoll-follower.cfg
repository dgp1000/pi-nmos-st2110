# Atoll PTP follower on the Uno Q (Arduino 8-in-1 hub, RTL8152 10/100 USB NIC).
# The NIC has RX-only software timestamps, so: patched ptp4l (/usr/local/sbin, built from
# ~/linuxptp v4.2 with the tsinfo check downgraded to a warning) + delay_mechanism NONE
# (one-way sync, path delay ~0.5 ms ignored). USB path adds a ~4 ms sawtooth of RX jitter,
# hence very slow PI gains: the servo averages over ~minutes; expect +/-2 ms of the GM.
[global]
slaveOnly              1
time_stamping          software
delay_mechanism        NONE
domainNumber           0
announceReceiptTimeout 6
step_threshold         0.01
pi_proportional_const  0.01
pi_integral_const      0.0003

#!/usr/bin/env bash
# Atoll — Pi-side config (the ST 2110 / PTP source). EDIT for your Pi, then deploy alongside
# launch-all.sh in the Pi user's home. The multicast groups + ports MUST match the PC's
# pc/atoll.conf (PI_AUDIO_* and PI_RAW_*), or the multiview won't see the Pi feeds.
PI_USER=dgperkins
USERHOME="/home/$PI_USER"
ISLAND_IFACE=eth0                                 # the Pi's wired island NIC
PI_AUDIO_GRP=239.10.10.10; PI_AUDIO_PORT=5004     # ST 2110-30 L24 audio
PI_RAW_GRP=239.10.10.21;   PI_RAW_PORT=5006       # ST 2110-20 raw video
MCAST_TTL=1
CLOCK_PORT=8000                                   # master-clock-web.py (PTP web clock)

#!/usr/bin/env bash
# ===========================================================================
#  Atoll — central configuration.  EDIT THIS for your environment; the scripts
#  read everything from here (no values are hardcoded elsewhere).
#  Sourced by the bash senders/renderer/launcher; the plain KEY=value lines are
#  also parsed by monitor-web.py and restore.ps1.
# ===========================================================================

# --- identity ---
ATOLL_USER="${ATOLL_USER:-david}"        # WSL/Linux user that runs the media pipeline
PI_USER=dgperkins                        # Raspberry Pi user (the ST 2110 / PTP source)
PI_HOST=pi5-nmos.local                   # the Pi (mDNS name); IP fallback is ISLAND_PI_IP

# --- platform: WSL2 (Windows host) vs Linux-native — drives the GPU/display/paths below ---
if grep -qiE "microsoft|WSL" /proc/version 2>/dev/null; then ATOLL_PLATFORM=wsl; else ATOLL_PLATFORM=linux; fi

# --- GPU / display ---
#  WSL needs the Mesa D3D12 driver (real GPU, not llvmpipe) + WSLg's PulseServer; a native box uses
#  the system defaults (the NVIDIA driver for GL, the session's PulseAudio/PipeWire). VIDEO_SINK is
#  the output element + its fullscreen flag — waylandsink on Wayland/WSLg; for an X11 session set it
#  to e.g. "ximagesink" (and handle fullscreen via your window manager).
if [ "$ATOLL_PLATFORM" = wsl ]; then
  export GALLIUM_DRIVER=d3d12
  export PULSE_SERVER="${PULSE_SERVER:-unix:/mnt/wslg/PulseServer}"
  export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/mnt/wslg/runtime-dir}"
  export WAYLAND_DISPLAY="${WAYLAND_DISPLAY:-wayland-0}"
fi
VIDEO_SINK="${VIDEO_SINK:-waylandsink fullscreen=true}"

# --- the wired ST 2110 "island" (the media L2 segment) ---
ISLAND_PC_IP=10.10.10.2                  # this host on the island
ISLAND_PI_IP=10.10.10.1                  # the Pi grandmaster on the island
MCAST_TTL=1                              # keep multicast on the local segment
# WSL renames the island NIC (eth0/eth1/...) across reboots, so detect it BY IP:
ISLAND_IFACE="$(ip -o -4 addr show 2>/dev/null | awk -v a="$ISLAND_PC_IP" '$4 ~ "^"a"/" {print $2; exit}')"
ISLAND_IFACE="${ISLAND_IFACE:-eth0}"

# --- management / external sources ---
PC_WIFI_IP=192.168.4.85                  # this host's mgmt IP (the iPad reaches the panel here)
MAC_MUSIC_HOST=192.168.6.159             # Mac "Now Playing" server (optional music source)
MAC_MUSIC_PORT=8008
MAC_MUSIC_TS="http://$MAC_MUSIC_HOST:$MAC_MUSIC_PORT/nowplaying.ts"

# --- HDHomeRun live-TV source (feeds the HEVC / "Live TV" tile) ---
HDHR_HOST=192.168.7.88
TV_CHANNEL=8.1
TV_URL="http://$HDHR_HOST:5004/auto/v$TV_CHANNEL"

# --- island multicast groups (group address + UDP port) ---
PI_AUDIO_GRP=239.10.10.10; PI_AUDIO_PORT=5004   # Pi ST 2110-30 L24 audio
PI_RAW_GRP=239.10.10.21;   PI_RAW_PORT=5006     # Pi ST 2110-20 raw video
HOME_GRP=239.10.10.22;     HOME_PORT=5008       # "Home videos" channel (NMOS m0)
HEVC_GRP=239.10.10.65;     HEVC_PORT=5010       # "PC HEVC 4K" channel (bbb)
MUSIC_GRP=239.10.10.30;    MUSIC_PORT=5012      # "Music" channel (Mac bridge)
REELS_GRP=239.10.10.31;    REELS_PORT=5014      # "Test Reels" channel
ANC_GRP=239.10.10.50;    ANC_PORT=5020       # ST 2110-40 ancillary (ATC timecode)
JPEGXS_GRP=239.10.10.60; JPEGXS_PORT=5030    # ST 2110-22 codec: JPEG XS (image/x-jxsc) over TS
J2K_GRP=239.10.10.70;    J2K_PORT=5016       # JPEG 2000 (J2K/RTP, RFC 5371) island tile
H264_GRP=239.10.10.75;   H264_PORT=5018      # H.264 elementary stream over RTP (RFC 6184) island tile
OPUS_GRP=239.10.10.80;   OPUS_PORT=5022      # Opus audio over RTP (RFC 7587) -- audio essence for the H.264 feed
MJPEG_GRP=239.10.10.85;  MJPEG_PORT=5024     # Motion JPEG over RTP (RFC 2435), all-intra
VP9_GRP=239.10.10.90;    VP9_PORT=5026       # VP9 over RTP (RFC 7741), CPU encode / GPU decode
TSRTP_GRP=239.10.10.95;  TSRTP_PORT=5028     # MPEG-TS over RTP (SMPTE ST 2022-2), pt 33, A/V programme
FEC_GRP=239.10.10.100;   FEC_PORT=5040       # ST 2022-1 FEC: media 5040, column FEC 5042, row FEC 5044

# --- media sources (paths) ---
#  On WSL the media lives on the Windows side (/mnt/c); on a native box it lives under the Linux
#  home. Override MUSIC_ROOT / REELS_LOOP / BBB_FILE for your own layout.
if [ "$ATOLL_PLATFORM" = wsl ]; then
  MEDIA_ROOT="/mnt/c/Users/perki"          # the Windows user dir (OneDrive, etc.)
  MUSIC_ROOT="${MUSIC_ROOT:-$MEDIA_ROOT/OneDrive/Music}"
  REELS_LOOP="${REELS_LOOP:-$MEDIA_ROOT/test-reels-loop.mp4}"
else
  MEDIA_ROOT="${MEDIA_ROOT:-$HOME}"
  MUSIC_ROOT="${MUSIC_ROOT:-$MEDIA_ROOT/Music}"
  REELS_LOOP="${REELS_LOOP:-$MEDIA_ROOT/atoll/test-reels-loop.mp4}"
fi
BBB_FILE="${BBB_FILE:-/mnt/c/Users/perki/iCloudDrive/Desktop/snapplings-regalmug-clip.mp4}"
HOME_PLAYLIST="${HOME_PLAYLIST:-/home/$ATOLL_USER/atoll-playlist}"   # symlink set built from MUSIC_ROOT
REELS_DIR="${REELS_DIR:-$MUSIC_ROOT/Test Reels}"

# --- ports / runtime ---
PANEL_PORT=8096                          # IS-05 switch panel + IS-04/05 inspector
REELS_SDP_PORT=8097                      # SDP server for the Test Reels NMOS sender
ATOLL_RUN=/home/$ATOLL_USER/atoll-run    # working copy of pc/*.sh (dodges the WSL 9p race; harmless on native)

# --- back-compat aliases (older scripts used these names) ---
IFACE="$ISLAND_IFACE"
HEVC_ADDR="$HEVC_GRP";   HEVC_IFACE="$ISLAND_IFACE"; HEVC_LOCALADDR="$ISLAND_PC_IP"; HEVC_TTL="$MCAST_TTL"
JXS_ADDR="$HOME_GRP";    JXS_PORT="$HOME_PORT";       JXS_LOCALADDR="$ISLAND_PC_IP"; JXS_TTL="$MCAST_TTL"

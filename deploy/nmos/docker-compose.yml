# Atoll NMOS stack: nmos-cpp registry + virtnode (example IS-04/05 resources) + AMWA NMOS Testing
# Tool. A user-defined bridge passes multicast for the containers' mDNS discovery and each web API
# is published to a distinct host port. Works under WSL2 (NAT) and on Linux-native alike.
#   docker compose up -d
services:
  nmos-registry:
    image: rhastie/nmos-cpp:latest
    container_name: nmos-registry
    hostname: nmos-registry
    domainname: local
    ports:
      - "8080:80"     # registry/query HTTP API (IS-04 query + IS-05 registration)
      - "8081:81"     # query websocket
      - "1883:1883"   # MQTT
    volumes:
      - "./registry.json:/home/registry.json"
    environment:
      - RUN_NODE=FALSE
    restart: unless-stopped
    networks: [nmos]

  nmos-virtnode:
    image: rhastie/nmos-cpp:latest
    container_name: nmos-virtnode
    hostname: nmos-virtnode
    domainname: local
    ports:
      - "8090:80"     # node HTTP API (IS-04 node + IS-05 connection)
      - "8091:81"     # node events websocket
    volumes:
      - "./node.json:/home/node.json"
    environment:
      - RUN_NODE=TRUE
    restart: unless-stopped
    networks: [nmos]
    depends_on: [nmos-registry]

  nmos-testing:
    image: amwa/nmos-testing:latest
    container_name: nmos-testing
    hostname: nmos-testing
    domainname: local
    entrypoint: |
      /bin/bash -c "/etc/init.d/dbus start;
      /etc/init.d/avahi-daemon start;
      python3 nmos-test.py"
    ports:
      - "5000:5000"   # NMOS Testing Tool web UI
    restart: unless-stopped
    networks: [nmos]
    depends_on: [nmos-virtnode]

networks:
  nmos:
    driver: bridge

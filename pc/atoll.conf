#!/usr/bin/env bash
# ===========================================================================
#  Atoll — central configuration.  EDIT THIS for your environment; the scripts
#  read everything from here (no values are hardcoded elsewhere).
#  Sourced by the bash senders/renderer/launcher; the plain KEY=value lines are
#  also parsed by monitor-web.py and restore.ps1.
# ===========================================================================

# --- identity ---
ATOLL_USER="${ATOLL_USER:-dgper}"        # WSL/Linux user that runs the media pipeline
PI_USER=dgperkins                        # Raspberry Pi user (the ST 2110 / PTP source)
PI_HOST=pi5-nmos.local                   # the Pi (mDNS name); IP fallback is ISLAND_PI_IP

# --- WSL GPU: Mesa D3D12 so GStreamer uses the real GPU (not CPU llvmpipe). Unset on Linux-native. ---
export GALLIUM_DRIVER=d3d12

# --- the wired ST 2110 "island" (the media L2 segment) ---
ISLAND_PC_IP=10.10.10.2                  # this host on the island
ISLAND_PI_IP=10.10.10.1                  # the Pi grandmaster on the island
MCAST_TTL=1                              # keep multicast on the local segment
# WSL renames the island NIC (eth0/eth1/...) across reboots, so detect it BY IP:
ISLAND_IFACE="$(ip -o -4 addr show 2>/dev/null | awk -v a="$ISLAND_PC_IP" '$4 ~ "^"a"/" {print $2; exit}')"
ISLAND_IFACE="${ISLAND_IFACE:-eth0}"

# --- management / external sources ---
PC_WIFI_IP=192.168.4.85                  # this host's mgmt IP (the iPad reaches the panel here)
MAC_MUSIC_HOST=192.168.6.159             # Mac "Now Playing" server (optional music source)
MAC_MUSIC_PORT=8008
MAC_MUSIC_TS="http://$MAC_MUSIC_HOST:$MAC_MUSIC_PORT/nowplaying.ts"

# --- island multicast groups (group address + UDP port) ---
PI_AUDIO_GRP=239.10.10.10; PI_AUDIO_PORT=5004   # Pi ST 2110-30 L24 audio
PI_RAW_GRP=239.10.10.20;   PI_RAW_PORT=5005     # Pi ST 2110-20 raw video
HOME_GRP=239.10.10.22;     HOME_PORT=5008       # "Home videos" channel (NMOS m0)
HEVC_GRP=239.10.10.65;     HEVC_PORT=5010       # "PC HEVC 4K" channel (bbb)
MUSIC_GRP=239.10.10.30;    MUSIC_PORT=5012      # "Music" channel (Mac bridge)
REELS_GRP=239.10.10.31;    REELS_PORT=5014      # "Test Reels" channel

# --- media sources (paths) ---
#  WIN_HOME is the Windows user dir as seen from WSL; on Linux-native set it to "$HOME".
WIN_HOME=/mnt/c/Users/$ATOLL_USER
BBB_FILE=/home/$ATOLL_USER/jxs-media/bbb-4k.mp4
HOME_PLAYLIST=/home/$ATOLL_USER/atoll-playlist   # symlink set built from MUSIC_ROOT
MUSIC_ROOT="$WIN_HOME/OneDrive/Music"
REELS_DIR="$MUSIC_ROOT/Test Reels"
REELS_LOOP="$WIN_HOME/test-reels-loop.mp4"

# --- ports / runtime ---
PANEL_PORT=8096                          # IS-05 switch panel + IS-04/05 inspector
REELS_SDP_PORT=8097                      # SDP server for the Test Reels NMOS sender
ATOLL_RUN=/home/$ATOLL_USER/atoll-run    # Linux-side copy of pc/*.sh (dodges the 9p race)
ATOLL_SRC=/mnt/c/Users/$ATOLL_USER/pi-nmos-st2110/pc   # the repo's pc/ dir

# --- back-compat aliases (older scripts used these names) ---
IFACE="$ISLAND_IFACE"
HEVC_ADDR="$HEVC_GRP";   HEVC_IFACE="$ISLAND_IFACE"; HEVC_LOCALADDR="$ISLAND_PC_IP"; HEVC_TTL="$MCAST_TTL"
JXS_ADDR="$HOME_GRP";    JXS_PORT="$HOME_PORT";       JXS_LOCALADDR="$ISLAND_PC_IP"; JXS_TTL="$MCAST_TTL"

# Atoll PTP follower config. Hybrid E2E: Sync/Announce stay multicast, but Delay_Req
# is UNICAST to the master. This is required because the island switch does IGMP
# snooping with no querier, so the grandmaster's multicast RX membership ages out and
# it ignores multicast Delay_Req. Unicast delay requests bypass that entirely.
# Software timestamping (Pi 2B/3/4 have no PTP hardware clock). Domain 0 + E2E to match
# the grandmaster (ptp4l -i eth0 -S). Median-filter the delay estimate to tame the
# 2B's jittery USB-NIC software timestamps. step_threshold lets it step the clock to
# adopt the master's time on first lock.
[global]
slaveOnly              1
time_stamping          software
hybrid_e2e             1
logMinDelayReqInterval -2
delay_filter           moving_median
delay_filter_length    16
step_threshold         1.0
